name: RoomQuest Provider Tests
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      omaha_lincoln_batch:
        description: 'Omaha and Lincoln read-only intake batch (blank, 1, or 2)'
        type: string
        required: false
        default: ''
      omaha_lincoln_offset:
        description: 'Zero-based start within the selected intake batch'
        type: number
        required: false
        default: 0
      south_hill_expansion_live:
        description: 'Read-only McGregor Hall, Victoria, Vance Arts and Town market audit through normal publisher guards'
        type: boolean
        required: false
        default: false
      south_hill_recovery_live:
        description: 'Read-only South Hill recovery audit including resumed Halifax collection; no database writes or activation'
        type: boolean
        required: false
        default: false
      civic_live:
        description: 'Read-only audit of reviewed civic sources through normal publisher guards (no database writes)'
        type: boolean
        required: false
        default: false
      holly_hill_recovery_live:
        description: 'Read-only audit of exactly five reviewed Holly Hill recovery feeds'
        type: boolean
        required: false
        default: false
      holly_hill_live:
        description: 'Read-only full Holly Hill batch audit including existing MapSee feeds'
        type: boolean
        required: false
        default: false
      farmville_south_boston_live:
        description: 'Read-only audit of the Farmville and South Boston source batch'
        type: boolean
        required: false
        default: false
      raleigh_live:
        description: 'Read-only Raleigh source readiness through production publisher guards'
        type: boolean
        required: false
        default: false
      mecklenburg_live:
        description: 'Read-only five-source Mecklenburg audit through the real shared collector (no database writes)'
        type: boolean
        required: false
        default: false
      mecklenburg_batch3_live:
        description: 'Read-only EVE-41 three-source Mecklenburg audit through shared publisher transport (no database writes)'
        type: boolean
        required: false
        default: false
      mycountyparks_live:
        description: 'Read-only live audit of all 99 MyCountyParks county calendars (no database writes)'
        type: boolean
        required: false
        default: false
      virginia_live:
        description: 'Read-only capture of two reviewed DCR event pages with production publisher guards'
        type: boolean
        required: false
        default: false
      virginia_details_live:
        description: 'Read-only capture of the reviewed Virginia event-details manifest (no database writes)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  provider-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'ci:validate' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate Vercel build selection
        if: github.event_name != 'workflow_dispatch' || !(inputs.south_hill_expansion_live || inputs.south_hill_recovery_live || inputs.civic_live || inputs.mecklenburg_live || inputs.mecklenburg_batch3_live || (inputs.holly_hill_live || inputs.holly_hill_recovery_live))
        run: node --test scripts/vercel-ignore.test.mjs
      - run: pip install -r requirements-dev.txt
      - name: Check Omaha and Lincoln intake
        if: github.event_name != 'workflow_dispatch' || inputs.omaha_lincoln_batch != ''
        run: python -m pytest tests/test_omaha_lincoln.py -q
      - name: Check expansion event descriptions
        if: github.event_name != 'workflow_dispatch'
        run: python -m pytest tests/test_expansion_narrative_mapping.py tests/test_hampton_roads_descriptions.py -q
      - name: Read-only Omaha and Lincoln publisher audit
        if: github.event_name == 'workflow_dispatch' && inputs.omaha_lincoln_batch != ''
        env:
          INTAKE_BATCH: ${{ inputs.omaha_lincoln_batch }}
          INTAKE_OFFSET: ${{ inputs.omaha_lincoln_offset }}
        shell: bash
        run: |
          limit=10
          if [ "$INTAKE_BATCH" = 2 ] && [ "$INTAKE_OFFSET" = 0 ]; then
            limit=58
          fi
          python scripts/audit_omaha_lincoln_intake.py --batch "$INTAKE_BATCH" --offset "$INTAKE_OFFSET" --limit "$limit"
      - name: Check South Hill expansion parsers and shared publication integration
        if: github.event_name != 'workflow_dispatch' || inputs.south_hill_expansion_live
        run: python -m pytest tests/test_mcgregor_hall.py tests/test_victoria_calendar.py tests/test_vance_arts.py tests/test_south_hill_markets.py tests/test_south_hill_expansion_pipeline.py tests/test_south_hill_expansion_audit.py -q
      - name: Check South Hill recovery collectors and checkpoints
        if: github.event_name != 'workflow_dispatch' || inputs.south_hill_recovery_live
        run: python -m pytest tests/test_discover_halifax_chunks.py tests/test_halifax_checkpoint_worker.py tests/test_halifax_venue_enrichment.py tests/test_publisher_schedule.py tests/test_shady_shack.py tests/test_south_hill_recovery_audit.py -q
      - name: Check civic adapters, notices, recurrence and read-only audit
        if: github.event_name != 'workflow_dispatch' || inputs.civic_live
        run: python -m pytest tests/test_legistar.py tests/test_virginia_civic.py tests/test_municipal_notices.py tests/test_civic_pipeline.py tests/test_civic_source_audit.py tests/test_civic_schedule.py tests/test_revize_civic.py tests/test_ics_civic_dates.py -q
      - name: Read-only reviewed civic source audit
        id: civic_audit
        if: github.event_name == 'workflow_dispatch' && inputs.civic_live
        run: python scripts/capture_civic_sources.py --overall-seconds 480 --output "$RUNNER_TEMP/civic-sources-audit.json"
      - name: Report civic source receipt counts and limits
        if: always() && steps.civic_audit.outcome != 'skipped' && steps.civic_audit.outcome != ''
        env:
          AUDIT_REPORT: ${{ runner.temp }}/civic-sources-audit.json
          COLLECTOR_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['AUDIT_REPORT'])
          if not path.exists():
              print(json.dumps({'collector_sha': os.environ['COLLECTOR_SHA'], 'audit_report': 'missing'}))
          else:
              raw = path.read_bytes()
              report = json.loads(raw)
              fields = ('schema_version', 'read_only', 'collector_sha', 'checked_at', 'finished_at',
                        'complete', 'duration_seconds', 'counts', 'limits', 'collector_files_sha256')
              print(json.dumps({'workflow_sha': os.environ['COLLECTOR_SHA'],
                                'audit_sha256': hashlib.sha256(raw).hexdigest(),
                                **{key: report.get(key) for key in fields}}, sort_keys=True))
              for source in report['sources']:
                  fields = ('source_key', 'scope', 'outcome', 'error', 'error_category',
                            'candidate_count', 'dated_notice_count', 'timed_notice_count',
                            'timed_candidate_count', 'verified_pin_count', 'explicit_cancellation_count',
                            'complete', 'checked_at', 'duration_seconds',
                            'source_preview_attempted', 'network_skipped')
                  print(json.dumps({key: source.get(key) for key in fields}, sort_keys=True))
          PY
      - name: Preserve complete civic source receipts
        if: always() && steps.civic_audit.outcome != 'skipped' && steps.civic_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: civic-sources-audit-${{ github.sha }}
          path: ${{ runner.temp }}/civic-sources-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Check Holly Hill batch parsers and guarded pipeline
        if: github.event_name != 'workflow_dispatch'
        run: python -m pytest tests/test_holly_hill_businesses.py tests/test_holly_hill_civic.py tests/test_holly_hill_institutions.py tests/test_holly_hill_pipeline.py tests/test_holly_hill_batch_audit.py tests/test_scworks_recovery.py tests/test_holly_hill_institution_recovery.py tests/test_holly_hill_recovery_pipeline.py tests/test_santee_town_calendar.py tests/test_santee_town_pipeline.py tests/test_publisher_admission.py tests/test_recdesk_transport.py -q
      - name: Read-only Holly Hill and regional MapSee audit
        id: holly_hill_audit
        if: github.event_name == 'workflow_dispatch' && (inputs.holly_hill_live || inputs.holly_hill_recovery_live)
        env:
          RECOVERY_ONLY: ${{ inputs.holly_hill_recovery_live }}
        run: |
          if [ "$RECOVERY_ONLY" = "true" ]; then
            # Five 45-second source caps plus 15 seconds for local audit overhead.
            python scripts/capture_holly_hill_batch.py --recovery-only --overall-seconds 240 --output "$RUNNER_TEMP/holly-hill-audit.json"
          else
            python scripts/capture_holly_hill_batch.py --output "$RUNNER_TEMP/holly-hill-audit.json"
          fi
      - name: Report Holly Hill audit outcomes
        if: always() && steps.holly_hill_audit.outcome != 'skipped'
        env:
          AUDIT_REPORT: ${{ runner.temp }}/holly-hill-audit.json
          COLLECTOR_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          path = Path(os.environ['AUDIT_REPORT'])
          if not path.exists():
              print(json.dumps({'collector_sha': os.environ['COLLECTOR_SHA'], 'audit_report': 'missing'}))
          else:
              raw = path.read_bytes()
              report = json.loads(raw)
              fields = ('schema_version', 'read_only', 'recovery_only', 'checked_at', 'finished_at',
                        'complete', 'active_complete', 'duration_seconds', 'counts', 'limits')
              print(json.dumps({'collector_sha': os.environ['COLLECTOR_SHA'],
                                'audit_sha256': hashlib.sha256(raw).hexdigest(),
                                **{key: report.get(key) for key in fields}}, sort_keys=True))
              for source in report['sources']:
                  fields = ('source_key', 'outcome', 'error', 'error_category', 'caused_by_http_status',
                            'candidate_count', 'complete', 'checked_at', 'duration_seconds',
                            'source_preview_attempted', 'network_skipped')
                  print(json.dumps({key: source.get(key) for key in fields}, sort_keys=True))
          PY
      - name: Preserve complete Holly Hill audit results
        if: always() && steps.holly_hill_audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holly-hill-audit-${{ github.sha }}
          path: ${{ runner.temp }}/holly-hill-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Read-only Farmville and South Boston source audit
        if: github.event_name == 'workflow_dispatch' && inputs.farmville_south_boston_live
        run: python scripts/capture_farmville_south_boston_batch.py --output "$RUNNER_TEMP/farmville-south-boston-audit.json"
      - name: Check Virginia public calendar parsers
        if: github.event_name != 'workflow_dispatch' || inputs.farmville_south_boston_live
        run: python -m pytest tests/test_farmville_south_boston_calendars.py tests/test_southside_pending_routes.py tests/test_maryland_public_calendars.py -q
      - if: github.event_name != 'workflow_dispatch' || !(inputs.south_hill_expansion_live || inputs.south_hill_recovery_live || inputs.civic_live || inputs.mecklenburg_live || inputs.mecklenburg_batch3_live || (inputs.holly_hill_live || inputs.holly_hill_recovery_live))
        run: python -m pytest tests/test_forward_geocoder.py tests/test_roomquest_entrypoint.py tests/test_mecklenburg_sources.py tests/test_clarksville_tourism.py tests/test_coopers_landing.py tests/test_good_shepherd.py tests/test_mecklenburg_batch3_pipeline.py tests/test_mecklenburg_batch3_audit.py tests/test_revize.py tests/test_south_hill_chamber.py tests/test_mecklenburg_batch2_pipeline.py tests/test_clarksville_players.py tests/test_maccallum_more.py tests/test_mecklenburg_ymca.py tests/test_mecklenburg_library_ics.py tests/test_wordpress_adapter.py tests/test_market_descriptions.py tests/test_biblioevents.py tests/test_mapsee_pipeline.py tests/test_roomquest_preview.py tests/test_squarespace_pilot.py tests/test_squarespace_family.py tests/test_jsonld_family.py tests/test_community_formats.py tests/test_ics_family.py tests/test_transient_staging.py tests/test_category_worker.py tests/test_category_entrypoint.py tests/test_chambermate.py tests/test_chambermate_integration.py tests/test_preview_transport_errors.py tests/test_virginia_state_parks_html.py tests/test_virginia_event_details.py tests/test_virginia_offsite_addresses.py tests/test_virginia_relative_event_links.py tests/test_mycountyparks.py tests/test_mycountyparks_integration.py tests/test_mycountyparks_cli.py tests/test_bellevue_times.py tests/test_bellevue_times_integration.py tests/test_publisher_robots_cache.py tests/test_event_media.py tests/test_media_demand.py tests/test_media_entrypoint.py tests/test_venue_resolver.py tests/test_roomquest_scoped_rpc.py -q
      - if: github.event_name != 'workflow_dispatch' || !(inputs.south_hill_expansion_live || inputs.south_hill_recovery_live || inputs.civic_live || inputs.mecklenburg_live || inputs.mecklenburg_batch3_live || (inputs.holly_hill_live || inputs.holly_hill_recovery_live))
        run: python -m pytest tests/test_plains_calendars.py tests/test_nebraska_library_ics.py tests/test_nebraska_venue_sources.py tests/test_raleigh_html.py tests/test_south_carolina_parks.py tests/test_publisher_evidence.py tests/test_madison_quality.py tests/test_iowa_tourism.py tests/test_reviewed_chambers.py tests/test_waterloo.py -q
      - name: Read-only MyCountyParks live verification
        id: mycountyparks_audit
        if: github.event_name == 'workflow_dispatch' && inputs.mycountyparks_live
        run: python scripts/scrape_mycountyparks.py --all-counties --timeout 30 --overall-timeout 900 --output "$RUNNER_TEMP/mycountyparks-audit.json"
      - name: Preserve public MyCountyParks audit results
        if: always() && steps.mycountyparks_audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycountyparks-audit-${{ github.sha }}
          path: ${{ runner.temp }}/mycountyparks-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Check bounded Virginia diagnostic
        if: github.event_name != 'workflow_dispatch' || !(inputs.south_hill_expansion_live || inputs.south_hill_recovery_live || inputs.civic_live || inputs.mecklenburg_live || inputs.mecklenburg_batch3_live || (inputs.holly_hill_live || inputs.holly_hill_recovery_live))
        run: python -m pytest tests/test_virginia_html_audit.py -q
      - name: Read-only Virginia event HTML capture
        id: virginia_audit
        if: github.event_name == 'workflow_dispatch' && (inputs.virginia_live || inputs.virginia_details_live)
        env:
          VIRGINIA_DETAILS_LIVE: ${{ inputs.virginia_details_live }}
        run: |
          if [ "$VIRGINIA_DETAILS_LIVE" = "true" ]; then
            python scripts/capture_virginia_event_html.py --manifest tests/fixtures/virginia_state_parks/enrichment-manifest-20261105.json --overall-timeout 1200 --output-dir "$RUNNER_TEMP/virginia-event-html-audit"
          else
            python scripts/capture_virginia_event_html.py --output-dir "$RUNNER_TEMP/virginia-event-html-audit"
          fi
      - name: Preserve public Virginia HTML evidence
        if: always() && steps.virginia_audit.outcome != 'skipped' && steps.virginia_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virginia-event-html-audit-${{ github.sha }}
          path: ${{ runner.temp }}/virginia-event-html-audit
          if-no-files-found: error
          retention-days: 7
      - name: Read-only South Hill expansion audit
        id: south_hill_expansion_audit
        if: github.event_name == 'workflow_dispatch' && inputs.south_hill_expansion_live
        run: python scripts/capture_south_hill_expansion.py --output "$RUNNER_TEMP/south-hill-expansion/audit.json" --documents-dir "$RUNNER_TEMP/south-hill-expansion/publisher-documents"
      - name: Preserve complete South Hill expansion receipts
        if: always() && steps.south_hill_expansion_audit.outcome != 'skipped' && steps.south_hill_expansion_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: south-hill-expansion-audit-${{ github.sha }}
          path: ${{ runner.temp }}/south-hill-expansion
          if-no-files-found: error
          retention-days: 14
      - name: Read-only South Hill recovery audit
        id: south_hill_recovery_audit
        if: always() && github.event_name == 'workflow_dispatch' && inputs.south_hill_recovery_live
        run: python scripts/capture_south_hill_recovery.py --output "$RUNNER_TEMP/south-hill-recovery-audit.json"
      - name: Preserve South Hill recovery receipts
        if: always() && steps.south_hill_recovery_audit.outcome != 'skipped' && steps.south_hill_recovery_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: south-hill-recovery-audit-${{ github.sha }}
          path: ${{ runner.temp }}/south-hill-recovery-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Read-only Mecklenburg five-source verification
        id: mecklenburg_audit
        if: github.event_name == 'workflow_dispatch' && inputs.mecklenburg_live
        run: python scripts/capture_mecklenburg_batch2.py --output "$RUNNER_TEMP/mecklenburg-five-source-audit.json"
      - name: Preserve public Mecklenburg source evidence
        if: always() && steps.mecklenburg_audit.outcome != 'skipped' && steps.mecklenburg_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mecklenburg-five-source-audit-${{ github.sha }}
          path: ${{ runner.temp }}/mecklenburg-five-source-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Read-only Mecklenburg EVE-41 three-source verification
        id: mecklenburg_batch3_audit
        if: github.event_name == 'workflow_dispatch' && inputs.mecklenburg_batch3_live
        run: python scripts/capture_mecklenburg_batch3.py --output "$RUNNER_TEMP/mecklenburg-batch3-audit.json"
      - name: Preserve public Mecklenburg EVE-41 source evidence
        if: always() && steps.mecklenburg_batch3_audit.outcome != 'skipped' && steps.mecklenburg_batch3_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mecklenburg-batch3-audit-${{ github.sha }}
          path: ${{ runner.temp }}/mecklenburg-batch3-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Read-only Raleigh batch readiness
        id: raleigh_audit
        if: github.event_name == 'workflow_dispatch' && inputs.raleigh_live
        run: python scripts/capture_raleigh_batch.py --output "$RUNNER_TEMP/raleigh-batch-audit.json"
      - name: Preserve public Raleigh audit evidence
        if: always() && steps.raleigh_audit.outcome != 'skipped' && steps.raleigh_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raleigh-batch-audit-${{ github.sha }}
          path: ${{ runner.temp }}/raleigh-batch-audit.json
          if-no-files-found: error
          retention-days: 14

