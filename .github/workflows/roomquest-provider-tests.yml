name: RoomQuest Provider Tests
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:
    inputs:
      raleigh_live:
        description: 'Read-only Raleigh source readiness through production publisher guards'
        type: boolean
        required: false
        default: false
      mecklenburg_live:
        description: 'Read-only five-source Mecklenburg audit through the real shared collector (no database writes)'
        type: boolean
        required: false
        default: false
      mecklenburg_batch3_live:
        description: 'Read-only EVE-41 three-source Mecklenburg audit through shared publisher transport (no database writes)'
        type: boolean
        required: false
        default: false
      mycountyparks_live:
        description: 'Read-only live audit of all 99 MyCountyParks county calendars (no database writes)'
        type: boolean
        required: false
        default: false
      virginia_live:
        description: 'Read-only capture of two reviewed DCR event pages with production publisher guards'
        type: boolean
        required: false
        default: false
      virginia_details_live:
        description: 'Read-only capture of the reviewed Virginia event-details manifest (no database writes)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  provider-tests:
    if: github.event_name == 'workflow_dispatch' || (github.event.label.name == 'ci:validate' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate Vercel build selection
        if: github.event_name != 'workflow_dispatch' || !(inputs.mecklenburg_live || inputs.mecklenburg_batch3_live)
        run: node --test scripts/vercel-ignore.test.mjs
      - run: pip install -r requirements-dev.txt
      - if: github.event_name != 'workflow_dispatch' || !(inputs.mecklenburg_live || inputs.mecklenburg_batch3_live)
        run: python -m pytest tests/test_forward_geocoder.py tests/test_roomquest_entrypoint.py tests/test_mecklenburg_sources.py tests/test_clarksville_tourism.py tests/test_coopers_landing.py tests/test_good_shepherd.py tests/test_mecklenburg_batch3_pipeline.py tests/test_mecklenburg_batch3_audit.py tests/test_revize.py tests/test_south_hill_chamber.py tests/test_mecklenburg_batch2_pipeline.py tests/test_clarksville_players.py tests/test_maccallum_more.py tests/test_mecklenburg_ymca.py tests/test_mecklenburg_library_ics.py tests/test_wordpress_adapter.py tests/test_mapsee_pipeline.py tests/test_roomquest_preview.py tests/test_squarespace_pilot.py tests/test_squarespace_family.py tests/test_jsonld_family.py tests/test_community_formats.py tests/test_ics_family.py tests/test_transient_staging.py tests/test_category_worker.py tests/test_category_entrypoint.py tests/test_chambermate.py tests/test_chambermate_integration.py tests/test_preview_transport_errors.py tests/test_virginia_state_parks_html.py tests/test_virginia_event_details.py tests/test_virginia_offsite_addresses.py tests/test_virginia_relative_event_links.py tests/test_mycountyparks.py tests/test_mycountyparks_integration.py tests/test_mycountyparks_cli.py tests/test_bellevue_times.py tests/test_bellevue_times_integration.py tests/test_publisher_robots_cache.py tests/test_event_media.py tests/test_media_demand.py tests/test_media_entrypoint.py tests/test_venue_resolver.py tests/test_roomquest_scoped_rpc.py -q
      - if: github.event_name != 'workflow_dispatch' || !(inputs.mecklenburg_live || inputs.mecklenburg_batch3_live)
        run: python -m pytest tests/test_raleigh_html.py tests/test_south_carolina_parks.py tests/test_publisher_evidence.py tests/test_madison_quality.py tests/test_iowa_tourism.py tests/test_reviewed_chambers.py tests/test_waterloo.py -q
      - name: Read-only MyCountyParks live verification
        id: mycountyparks_audit
        if: github.event_name == 'workflow_dispatch' && inputs.mycountyparks_live
        run: python scripts/scrape_mycountyparks.py --all-counties --timeout 30 --overall-timeout 900 --output "$RUNNER_TEMP/mycountyparks-audit.json"
      - name: Preserve public MyCountyParks audit results
        if: always() && steps.mycountyparks_audit.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mycountyparks-audit-${{ github.sha }}
          path: ${{ runner.temp }}/mycountyparks-audit.json
          if-no-files-found: error
          retention-days: 14
      - name: Check bounded Virginia diagnostic
        if: github.event_name != 'workflow_dispatch' || !(inputs.mecklenburg_live || inputs.mecklenburg_batch3_live)
        run: python -m pytest tests/test_virginia_html_audit.py -q
      - name: Read-only Virginia event HTML capture
        id: virginia_audit
        if: github.event_name == 'workflow_dispatch' && (inputs.virginia_live || inputs.virginia_details_live)
        env:
          VIRGINIA_DETAILS_LIVE: ${{ inputs.virginia_details_live }}
        run: |
          if [ "$VIRGINIA_DETAILS_LIVE" = "true" ]; then
            python scripts/capture_virginia_event_html.py --manifest tests/fixtures/virginia_state_parks/enrichment-manifest-20261105.json --overall-timeout 1200 --output-dir "$RUNNER_TEMP/virginia-event-html-audit"
          else
            python scripts/capture_virginia_event_html.py --output-dir "$RUNNER_TEMP/virginia-event-html-audit"
          fi
      - name: Preserve public Virginia HTML evidence
        if: always() && steps.virginia_audit.outcome != 'skipped' && steps.virginia_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: virginia-event-html-audit-${{ github.sha }}
          path: ${{ runner.temp }}/virginia-event-html-audit
          if-no-files-found: error
          retention-days: 7
      - name: Read-only Mecklenburg five-source verification
        id: mecklenburg_audit
        if: github.event_name == 'workflow_dispatch' && inputs.mecklenburg_live
        run: python scripts/capture_mecklenburg_batch2.py --output "$RUNNER_TEMP/mecklenburg-five-source-audit.json"
      - name: Preserve public Mecklenburg source evidence
        if: always() && steps.mecklenburg_audit.outcome != 'skipped' && steps.mecklenburg_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mecklenburg-five-source-audit-${{ github.sha }}
          path: ${{ runner.temp }}/mecklenburg-five-source-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Read-only Mecklenburg EVE-41 three-source verification
        id: mecklenburg_batch3_audit
        if: github.event_name == 'workflow_dispatch' && inputs.mecklenburg_batch3_live
        run: python scripts/capture_mecklenburg_batch3.py --output "$RUNNER_TEMP/mecklenburg-batch3-audit.json"
      - name: Preserve public Mecklenburg EVE-41 source evidence
        if: always() && steps.mecklenburg_batch3_audit.outcome != 'skipped' && steps.mecklenburg_batch3_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mecklenburg-batch3-audit-${{ github.sha }}
          path: ${{ runner.temp }}/mecklenburg-batch3-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Read-only Raleigh batch readiness
        id: raleigh_audit
        if: github.event_name == 'workflow_dispatch' && inputs.raleigh_live
        run: python scripts/capture_raleigh_batch.py --output "$RUNNER_TEMP/raleigh-batch-audit.json"
      - name: Preserve public Raleigh audit evidence
        if: always() && steps.raleigh_audit.outcome != 'skipped' && steps.raleigh_audit.outcome != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: raleigh-batch-audit-${{ github.sha }}
          path: ${{ runner.temp }}/raleigh-batch-audit.json
          if-no-files-found: error
          retention-days: 14
