[project]
name = "roomquest-community-calendar"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "beautifulsoup4==4.15.0",
  "lxml==6.1.3",
  "html5lib==1.1",
  "pytz==2026.5",
  "requests==2.34.2",
  "urllib3==2.8.0",
  "feedparser==6.0.14",
  "icalendar==6.3.2",
  "recurring-ical-events==3.8.2",
  "Jinja2==3.1.6",
]

# Vercel uses pyproject.toml when this file exists, so runtime parser dependencies
# MUST be declared above (requirements.txt alone is not installed).
[tool.vercel]
entrypoint = "api.index:handler"

